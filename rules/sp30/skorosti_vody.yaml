# Допустимая скорость движения воды в трубопроводах В1/Т3 (по условию шума)
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: water_velocity_limits
source: "СП 30.13330.2020, приложение И; п. 8.26"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 121, 29), 2026-07-18"
punkt_8_26:
  punkt: "СП 30.13330.2020, п. 8.26"
  pravilo: >
    Скорость движения воды в системе внутреннего водоснабжения принимают в зависимости
    от допустимого эквивалентного уровня шума в помещении: выше 40 дБ — по max_m_s;
    40 дБ и ниже — по приложению И (tablitsa ниже).
  max_m_s_pri_shume_vyshe_40_db:
    obshchestvennye_zdaniya: 1.5
    administrativno_bytovye: 2.0
    proizvodstvennye: 3.0
units: "м/с; пара кран/вентиль (числитель — при кранах, знаменатель — при вентилях)"
# Столбцы — коэффициент местных сопротивлений подключения приборов/стояка
# с арматурой, приведённый к скорости воды в трубах: до 5, 10, 15, 20, 30.
tablitsa:
  - {shum_db: 25, kms_5: [1.5, 1.5], kms_10: [1.1, 0.7], kms_15: [0.9, 0.55], kms_20: [0.75, 0.5], kms_30: [0.6, 0.4]}
  - {shum_db: 30, kms_5: [1.5, 1.5], kms_10: [1.5, 1.2], kms_15: [1.2, 1.0], kms_20: [1.0, 0.8], kms_30: [0.85, 0.65]}
  - {shum_db: 35, kms_5: [1.5, 1.5], kms_10: [1.5, 1.5], kms_15: [1.5, 1.1], kms_20: [1.2, 0.95], kms_30: [1.0, 0.8]}
  - {shum_db: 40, kms_5: [1.5, 1.5], kms_10: [1.5, 1.5], kms_15: [1.5, 1.5], kms_20: [1.5, 1.5], kms_30: [1.3, 1.2]}
primechaniya:
  - "Числитель — допустимая скорость при кранах, знаменатель — при вентилях."
  - >
    Для труб через несколько помещений принимать в расчёт помещение с наименьшим
    допустимым уровнем шума и арматуру с наибольшим КМС на участке 30 м в обе
    стороны от помещения.
  - >
    При арматуре с большим гидравлическим сопротивлением (балансировочные клапаны,
    регуляторы давления) ограничивать рабочий перепад давления во избежание шума.
