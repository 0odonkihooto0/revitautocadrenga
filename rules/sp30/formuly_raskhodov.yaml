# Формулы определения расчётных расходов воды и стоков (раздел 5)
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: water_demand_formulas
source: "СП 30.13330.2020, пп. 5.2–5.7"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 15–17), 2026-07-18"
formuly:
  q_sekundny:
    formula: "q = 5 * q0 * alpha"
    nomer: "(2)"
    punkt: "СП 30.13330.2020, п. 5.3"
    peremennye:
      q: "максимальный расчётный расход воды на участке (q_tot, q_h, q_c), л/с"
      q0: "расход воды прибором по п. 5.2 (таблицы А.1/А.2), л/с"
      alpha: >
        коэффициент по приложению Б: таблица Б.1 при P > 0,1 и N <= 200,
        при других значениях P и N — таблица Б.2
    primechaniya:
      - >
        Расход на концевых участках — по расчёту, но не меньше максимального
        секундного расхода одного из установленных приборов (п. 5.3, прим. 1).
  q0_bez_dannykh:
    pravilo: >
      В жилых и общественных зданиях без сведений о расходах и характеристиках
      приборов допускается принимать q0_tot = 0,3 л/с, q0_h = q0_c = 0,2 л/с.
    punkt: "СП 30.13330.2020, п. 5.2, примечание 2"
  veroyatnost_deystviya:
    formula: "P = (q_hr_u * U) / (q0 * N * 3600); NP = (q_hr_u * U) / (q0 * 3600)"
    nomer: "(3)"
    punkt: "СП 30.13330.2020, п. 5.4а"
    usloviye: "однотипные водопотребители в здании, без учёта изменения U/N"
    peremennye:
      q_hr_u: "расход воды потребителем в час наибольшего водопотребления (таблица А.2), л"
      U: "число водопотребителей"
      N: "число санитарно-технических приборов"
    primechaniya:
      - "При отсутствии данных о числе приборов допускается N = U (п. 5.4, прим. 1)."
  veroyatnost_grupp:
    formula: "P = sum(N_i * P_i) / sum(N_i)"
    nomer: "(4)"
    punkt: "СП 30.13330.2020, п. 5.4б"
    usloviye: "отличающиеся группы водопотребителей в здании"
  q_stokov_stoyak:
    formula: "qs = q_tot + q0s_max"
    nomer: "(5)"
    punkt: "СП 30.13330.2020, п. 5.5"
    peremennye:
      q_tot: "общий максимальный расчётный расход стоков согласно п. 5.3, л/с"
      q0s_max: "расход стоков от прибора с максимальным водоотведением (таблица А.1), л/с"
  q_stokov_gorizontalny:
    formula: "qsL = q_hr_tot / 3.6 + Ks * q0s"
    nomer: "(7)"
    punkt: "СП 30.13330.2020, п. 5.7"
    peremennye:
      q_hr_tot: "общий максимальный часовой расход воды на участке, м3"
      Ks: "коэффициент по таблице 5.1 (см. tablitsa_5_1)"
      q0s: "расход стоков от прибора с максимальной ёмкостью (таблица А.1), л/с"
