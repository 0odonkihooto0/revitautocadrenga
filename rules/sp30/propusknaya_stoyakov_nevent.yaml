# Пропускная способность невентилируемых канализационных стояков
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: sewer_stack_capacity_unvented
source: "СП 30.13330.2020, приложение К, таблицы К.5–К.8"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 124–127), 2026-07-18, автосверка по столбцам"
units:
  vysota_m: "рабочая высота стояка, м"
  ugol_grad: "угол присоединения поэтажных отводов к стояку, градус"
  qs: "пропускная способность, л/с; порядок колонок — kolonki (пары «стояк/отвод», мм); null = «–»"
primechaniya:
  - >
    Применение: п. 19.2 — при расходе выше табличного увеличить диаметр стояка
    или рассредоточить расход по нескольким стоякам.
  - >
    К.7, высота 7 м, угол 87,5°, стояк 150/отвод 50: значение 2,60 перенесено из PDF
    как напечатано (выбивается из монотонности столбца — вероятная опечатка источника).
  - >
    К.8 действительна только для воздушных клапанов с площадью живого сечения
    воздушного потока 1650 мм² (стояки 50 мм) и 3170 мм² (стояки 110 (100) мм).
