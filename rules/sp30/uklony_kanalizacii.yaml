# Уклоны и режим самоочищения самотёчной (безнапорной) канализации
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
#
# Важно: в СП 30.13330.2020 нет таблицы фиксированных уклонов по диаметрам
# (как было в СНиП 2.04.01-85*) — уклон выбирается расчётом по условию
# самоочищения; фиксированные значения остались только для частных случаев.
rule: sewer_slope_self_cleaning
source: "СП 30.13330.2020, п. 18.2, п. 19.1 (формула 33), п. 21.7"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 65, 75, 76, 84), 2026-07-18"
samoochishchenie:
  usloviye: "V * sqrt(h/d) >= K"
  formula_nomer: "(33)"
  punkt: "СП 30.13330.2020, п. 19.1"
  K:
    polimernye_truby: 0.5
    prochie_materialy: 0.6
  min_skorost_m_s: 0.7
  min_napolneniye_h_d: 0.3
neraschetnye_uchastki:
  pravilo: >
    Если условие (33) невыполнимо из-за малого расхода — сначала увеличить число
    стояков на отводном трубопроводе; только при отсутствии такой возможности
    нерасчётные участки прокладывать с уклоном 1/d (d — диаметр трубы, мм).
  uklon: "1/d"
  punkt: "СП 30.13330.2020, п. 19.1"
pryamolineynost:
  pravilo: >
    Участки сети прокладывать прямолинейно с уклоном согласно 19.1; изменять уклон
    сборного отводного (горизонтального) трубопровода не допускается.
  punkt: "СП 30.13330.2020, п. 18.2"
vnutrenniye_vodostoki:
  min_uklon_podvesnykh: 0.005
  prochie: "по требованиям раздела 19"
  punkt: "СП 30.13330.2020, п. 21.7"
vypusk:
  pravilo: >
    Диаметр и уклон выпуска определять расчётом; конструктивно диаметр выпуска
    не меньше диаметра наибольшего из присоединяемых стояков.
  punkt: "СП 30.13330.2020, п. 18.34"
