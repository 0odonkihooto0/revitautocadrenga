# Требуемый напор на вводе и потери напора на участках (раздел 8)
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: required_head_formulas
source: "СП 30.13330.2020, пп. 8.27, 8.28, формулы (14), (15)"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 29–30), 2026-07-18"
formuly:
  trebuemyi_napor:
    formula: "Htr = Hgeom + sum(Hil) + Hpr + sum(Hvod) + Htepl + Hvvod"
    nomer: "(14)"
    punkt: "СП 30.13330.2020, п. 8.27"
    units: "м вод. ст."
    peremennye:
      Hgeom: >
        геометрическая высота расположения диктующего санитарно-технического прибора
        (пожарного крана) над точкой подключения, м вод. ст.
      Hil: "сумма потерь напора на всех участках трубопровода диктующего направления, м вод. ст."
      Hpr: "напор (давление) перед диктующим прибором, м вод. ст., принимают согласно 8.21"
      Hvod: >
        сумма потерь напора в узлах учёта потребляемой воды (общем для жилого комплекса,
        общедомовом, индивидуальном), м вод. ст., принимают согласно 12.15
      Htepl: >
        потери напора в теплообменнике (водонагревателе), принимают ориентировочно
        0,03 МПа (3 м вод. ст.)
      Hvvod: >
        потери напора на вводе/вводах водопровода при пропуске расхода воды на
        хозяйственно-питьевые нужды и (или) противопожарного расхода, м вод. ст.
  poteri_na_uchastke:
    formula: "Hil = i * l * (1 + kl)"
    nomer: "(15)"
    punkt: "СП 30.13330.2020, п. 8.28"
    units: "м вод. ст."
    peremennye:
      i: >
        удельные потери напора единицы длины трубопровода l при температуре воды 10 °C,
        по таблицам гидравлического расчёта, расчётным формулам с учётом шероховатости
        материала труб или данным производителя труб
      l: "длина участка трубопровода, м"
      kl: "коэффициент потерь напора в местных сопротивлениях (см. koefficient_kl)"
koefficient_kl:
  punkt: "СП 30.13330.2020, п. 8.28"
  values:
    hoz_protivopozharny_zhilyh_obshchestvennyh: 0.2
    proizvodstvenny_vodoprovod: 0.2
    hoz_pitevoy_zhilyh_obshchestvennyh: 0.3
    obedinenny_proizvodstvenny_protivopozharny: 0.15
    protivopozharny: 0.1
