# Пропускная способность вентилируемых канализационных стояков
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: sewer_stack_capacity_vented
source: "СП 30.13330.2020, приложение К, таблицы К.1–К.4"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 122–123), 2026-07-18"
units:
  otvod_mm: "наружный диаметр поэтажных отводов, мм (для SML — DN)"
  ugol_grad: "угол присоединения поэтажных отводов к стояку, градус"
  qs: "пропускная способность стояка, л/с, по диаметру труб стояка, мм; null = «–»"
primechaniye: >
  Трубы по К.1–К.4: ПВХ 110×3,2; ПП 110×2,7; чугунные раструбные и SML 110×3,5;
  ПВХ 50×1,8; ПП 50×1,8; SML 50×3,5. Применение: п. 19.2 — при расходе выше
  табличного увеличить диаметр стояка или рассредоточить расход по стоякам.
  Невентилируемые стояки (таблицы К.5–К.8) — в propusknaya_stoyakov_nevent.yaml.
