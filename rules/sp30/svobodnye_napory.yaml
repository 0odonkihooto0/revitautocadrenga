# Свободные и гидростатические напоры в системах внутреннего водоснабжения
# Слой 1 базы знаний (см. docs/02-arhitektura.md §4)
rule: free_head_requirements
source: "СП 30.13330.2020, пп. 7.9, 7.10, 8.21, 8.22"
verified: "сверено с PDF ФАУ ФЦС (стр. документа 22, 29), 2026-07-18"
units: "м вод. ст. (в скобках МПа)"
svobodny_napor_verhnego_pribora:
  min_m: 20.0
  punkt: "СП 30.13330.2020, п. 8.21"
  tekst: >
    Свободный напор (давление) на отметке наиболее высоко расположенного санитарного
    прибора в зоне системы водоснабжения следует принимать не менее 20,0 м вод. ст. (0,2 МПа).
gidrostatichesky_napor_nizhnego_pribora:
  max_m: 45.0
  punkt: "СП 30.13330.2020, п. 7.10"
  tekst: >
    Гидростатический напор в системе хозяйственно-противопожарного водопровода на отметке
    наиболее низко расположенного санитарно-технического прибора не должен превышать
    45 м вод. ст. (0,45 МПа). Допускается увеличение свыше 0,45 МПа, если арматура
    и трубопроводы рассчитаны на соответствующее давление; при расчётном напоре свыше
    45 м вод. ст. следует предусматривать раздельную сеть противопожарного водопровода.
  primechaniye: >
    П. 8.22: для хозяйственно-питьевого водоснабжения гидростатический напор — согласно
    7.10; при расчётном напоре свыше 45 м вод. ст. — регуляторы давления, снижающие его
    при статическом и динамическом режимах.
gidrostatichesky_napor_razdelny_protivopozharny:
  max_m: 60.0
  punkt: "СП 30.13330.2020, п. 7.10"
  tekst: >
    Гидростатический напор в системе раздельного противопожарного водопровода на отметке
    у наиболее низко расположенного пожарного крана не должен превышать 60 м вод. ст. (0,60 МПа).
napor_pozharnyh_kranov:
  punkt: "СП 30.13330.2020, п. 7.9"
  tekst: >
    Свободный напор у пожарных кранов должен обеспечивать компактные пожарные струи
    высотой не менее высоты помещения (от пола до наивысшей точки перекрытия), но не менее:
  min_vysota_strui_m:
    zhilye_obshchestvennye_proizvodstvennye_do_50m: 6
    zhilye_svyshe_50m: 8
    obshchestvennye_proizvodstvennye_svyshe_50m: 16
